<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spalla">
<meta name="theme-color" content="#0e1013">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Spalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen stage. A liquid fill rises from the bottom as the timer;
   every screen is drawn twice (base + fill layer) and the fill layer is clipped,
   so text and figures invert cleanly where the liquid passes. */
:root{
  --bg:#0e1013;        /* near-black, faint blue bias */
  --ink:#f3efe8;       /* warm white */
  --muted:#8b9099;
  --line:#23272e;
  --panel:#171a1f;
  --orange:#ff6a1a;    /* international orange: effort */
  --ready:#272c34;     /* graphite: waiting */
  --blue:#86b4ff;      /* pendulum: relaxed movement */
  --red:#ff453a;       /* spingi: sforzo */
  --green:#32d74b;     /* rilassa */
  --dark:#15110c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

#stage{position:fixed;inset:0;cursor:pointer;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}
.layer.base{background:var(--bg);color:var(--ink);--gapc:var(--bg);--acc:var(--orange)}
.layer.fill{background:var(--tone);color:var(--tink);--gapc:var(--tone);--acc:var(--tacc);clip-path:inset(100% 0 0 0);will-change:clip-path;transition:background-color .5s,color .5s}
#stage[data-tone="ready"]{--tone:var(--ready);--tink:var(--ink);--tacc:var(--orange)}
#stage[data-tone="push"]{--tone:var(--red);--tink:var(--dark);--tacc:var(--dark)}
#stage[data-tone="rest"]{--tone:var(--green);--tink:var(--dark);--tacc:var(--dark)}
#stage[data-tone="done"]{--tone:var(--orange);--tink:var(--dark);--tacc:var(--dark)}
#stage[data-tone="push"] .base{--acc:var(--red)}
#stage[data-tone="rest"] .base{--acc:var(--green)}
#stage[data-tone="pend"]{--tone:var(--blue);--tink:var(--dark);--tacc:var(--dark)}
#stage[data-tone="pend"] .base{--acc:var(--blue)}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 22px)}
.enter > *, .enter .mid > *, .enter .center > *{animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
.enter > :nth-child(2), .enter .mid > :nth-child(2), .enter .center > :nth-child(2){animation-delay:.05s}
.enter > :nth-child(3), .enter .mid > :nth-child(3), .enter .center > :nth-child(3){animation-delay:.1s}
.enter > :nth-child(4), .enter .mid > :nth-child(4){animation-delay:.15s}
.enter > :nth-child(n+5), .enter .mid > :nth-child(n+5){animation-delay:.2s}
.enter > .mid, .enter > .center{animation:none}
@keyframes enter{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}

/* vetro: tinta presa dal colore del testo, cosi funziona sia sul nero che sul liquido */
.glass{background:color-mix(in srgb,currentColor 8%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 11%,transparent),inset 0 1px 0 color-mix(in srgb,currentColor 20%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6)}

/* anello di avanzamento: 3 giri + pendolo */
.ring{display:block;flex-shrink:0;overflow:visible}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .rt{stroke:currentColor;opacity:.16}
.ring .rp{stroke:var(--acc);transition:opacity .3s}
.ring .rp.pd{stroke:var(--pd)}
.layer.base{--pd:var(--blue)}
.layer.fill{--pd:var(--tacc)}
.pill{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:999px;min-width:0}
.pill .rw{position:relative;width:46px;height:46px;flex-shrink:0}
.pill .rw .ring{width:100%;height:100%}
.pill .rw b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:0;font-variant-numeric:tabular-nums}
.pill .pt{display:flex;flex-direction:column;gap:2px;line-height:1.05;min-width:0}
.pill strong{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;white-space:nowrap}
.pill small{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* numeri che scorrono, come il timer di iOS */
.swap{display:inline-grid}
.swap > span{grid-area:1/1}
.sw-in{animation:swIn .22s ease-out both}
@keyframes swIn{from{opacity:.35}}
.sub{opacity:.6}
.eyebrow{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.1em;text-transform:uppercase;min-height:44px}
.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;transition:transform .15s}
.icon:active{transform:scale(.9)}
.icon svg{width:18px;height:18px;opacity:.85}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;line-height:.8;letter-spacing:-.02em}
.num .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num .dg{display:block;height:.74em;width:auto;overflow:visible}
.num .dg path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.segs{display:flex;gap:4px;margin-top:6px}
.segs i{flex:1;height:4px;border-radius:2px;background:currentColor;opacity:.18}
.segs i.on{opacity:.7}
.segs i.cur{opacity:1}

/* ---- home ---- */
.home{overflow-y:auto;gap:20px;cursor:default;-webkit-overflow-scrolling:touch}
.home header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.home h1{font-family:var(--display);font-weight:700;font-size:clamp(76px,24vw,124px);line-height:.84;margin:8px 0 0;letter-spacing:-.01em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1.5px solid var(--orange);color:var(--orange);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.week{display:flex;gap:6px;align-items:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;max-width:38px}
.week .d i{width:100%;aspect-ratio:1;max-width:30px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.week .d.on i{background:var(--orange);border-color:var(--orange)}
.week .d.today i{border-color:var(--muted)}
.week .d.on.today i{border-color:var(--orange)}
.week .d span{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.week .d.today span{color:var(--ink)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:500}
.plan li:first-child{border-top:1px solid var(--line)}
.plan .n{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.plan .t{font-family:var(--display);font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan li.pend .n{color:var(--blue)}
.foot{display:flex;justify-content:space-between;gap:6px 12px;color:var(--muted);font-size:15px;flex-wrap:wrap}
.foot b{color:var(--ink);font-weight:600}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;flex-shrink:0;padding-top:4px}
.go{display:block;width:100%;min-height:64px;border-radius:20px;background:var(--orange);color:var(--dark);font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0;transition:transform .15s}
.go:active,.ghost:active{transform:scale(.97)}
.ghost{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:64px;border-radius:20px;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.08);padding:0 18px 0 10px;box-sizing:border-box;font-weight:600;font-size:16px;transition:transform .15s;text-align:left;gap:10px}
.ghost small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.ghost .gl{display:flex;align-items:center;gap:12px;min-width:0}
.ghost .ring{width:44px;height:44px}
.toggle{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-height:44px;padding:0 2px}
.toggle svg{width:20px;height:20px}
.toggle.on{color:var(--ink)}

/* ---- home v3: titolo + anello in alto, programma al centro, tasti in basso.
   Le card hanno proporzioni fisse: non si schiacciano mai, al massimo la pagina scorre. ---- */
.home{gap:18px;padding-bottom:0}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.h-top .eyebrow{text-transform:uppercase}
.home .h-top h1{font-size:clamp(52px,15vw,72px);margin:6px 0 0}
.h-sub{margin-top:8px;color:var(--muted);font-size:15px;font-weight:500}
.h-sub b{color:var(--ink);font-weight:600}
.h-hero{position:relative;isolation:isolate;width:clamp(96px,28vw,124px);aspect-ratio:1;flex-shrink:0}
.h-hero::before{content:"";position:absolute;inset:-34%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,106,26,.24),rgba(255,106,26,.07) 55%,transparent);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);opacity:.7}}
.h-hero .ring{width:100%;height:100%}
.h-hero .ring circle{stroke-width:3.6}
.h-hero .ring .rt{opacity:.14}
.h-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.h-center b{font-family:var(--display);font-weight:600;font-size:clamp(34px,10vw,44px);line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.h-center span{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.h-center .ok{width:38px;height:38px;color:var(--orange);display:block}
.h-plan{display:flex;flex-direction:column;gap:12px;margin:auto 0}
.h-sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.h-sec span:first-child{color:var(--ink);font-size:15px}
.h-sec span:last-child{color:var(--muted);text-align:right}
.h-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc{cursor:pointer;transition:transform .2s cubic-bezier(.3,1.4,.4,1);position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;align-items:center;gap:2px;padding:8px 6px 11px;border-radius:22px;background:var(--panel);--gapc:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.06);min-width:0;aspect-ratio:1/1.1;overflow:hidden}
.pc:active{transform:scale(.95)}
.pc .fig{width:100%;height:100%;min-height:0;transform:scale(1.12);transform-origin:50% 52%}
.pc .ready .fig text,.work .fig text{display:none}
.fig text{display:none}
.pc b{position:relative;font-family:var(--display);font-weight:700;font-size:14px;line-height:1;text-transform:uppercase;letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pn{position:absolute;z-index:1;top:9px;left:12px;font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted)}
.pc.pd{grid-column:1/-1;aspect-ratio:auto;height:clamp(84px,11vh,104px);grid-template-rows:none;grid-template-columns:auto 1fr;justify-items:start;gap:14px;padding:4px 18px 4px 14px;--acc:var(--blue)}
.pc.pd .fig{width:auto;height:100%;aspect-ratio:1;transform:scale(1.25);transform-origin:50% 60%}
.pc.pd b{font-size:17px}
.pc.pd .pn{color:var(--blue)}
.home .actions{position:sticky;bottom:0;margin:0 -22px;padding:14px 22px calc(env(safe-area-inset-bottom,0px) + 20px);background:linear-gradient(to bottom,transparent,var(--bg) 30%);display:flex;flex-direction:row;align-items:stretch;gap:10px}
.home .actions .snd{width:64px;height:auto;min-height:64px;border-radius:20px}
.home .actions .snd svg{width:22px;height:22px}
.home .go{flex:1 1 auto;width:auto;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px}
.home .go svg{width:24px;height:24px;flex-shrink:0}
.home .go small{font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:0;text-transform:none;opacity:.7}
.home .go::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out 1.4s infinite}
@keyframes shine{0%{transform:translateX(-120%)}28%,100%{transform:translateX(120%)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1 1 auto}
.two .go{flex-direction:column;gap:3px;min-height:70px;font-size:24px}
.go.alt{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08)}
.home .go.alt::after{display:none}

/* ---- ready ---- */
.ready .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0}
.ready h2{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,62px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.ready .fig{width:min(88vw,360px);height:auto;max-height:40vh;align-self:center;margin:2px 0}
.cue{font-size:18px;line-height:1.35;margin:0;max-width:32ch;text-wrap:pretty}
.posture{font-size:15px;font-weight:600;margin:0;opacity:.6}
.bot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tapto{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.count{display:flex;align-items:baseline;gap:4px}
.count .num{font-size:58px;display:block}

/* ---- work ---- */
.work .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.phase{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:8px;padding-left:.22em;text-align:center}
.work .num.big{font-size:clamp(120px,min(46vw,26vh),280px)}
.reps{display:flex;gap:7px;margin-top:20px}
.reps i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.4;box-sizing:border-box;transition:all .3s}
.reps i.on{background:currentColor;opacity:.7}
.reps i.cur{background:currentColor;opacity:1;transform:scale(1.3)}
.work .fig{width:min(70vw,280px);height:auto;max-height:30vh;align-self:center;margin-bottom:10px}
.work .bot{font-size:15px;font-weight:600}
.work .exname{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:14px;text-align:center}

/* ---- done ---- */
.done{justify-content:center;gap:14px;cursor:default}
.done .ring{width:min(46vw,200px);height:auto;aspect-ratio:1;max-width:100%;margin-bottom:10px}
.done .ring circle{stroke-width:4.2}
.done .check{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:check .5s cubic-bezier(.3,.7,.2,1) 1.6s forwards}
@keyframes check{to{stroke-dashoffset:0}}
.streak{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.done h1{font-family:var(--display);font-weight:700;font-size:clamp(96px,30vw,160px);line-height:.84;margin:0;text-transform:uppercase}
.done p{font-size:19px;margin:0}
.done .week{margin:18px 0 6px;max-width:320px}
.done .week .d i{border-color:currentColor;opacity:.5}
.done .week .d.on i{background:currentColor;border-color:currentColor;opacity:1}
.done .week .d span{color:currentColor;opacity:.7}
.done .go{margin-top:24px;background:var(--dark);color:var(--orange)}

/* ---- figures ---- */
.fig{display:block;overflow:visible;flex-shrink:0}
.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .bd{opacity:.42}
.fig .bd path{stroke:currentColor}
.fig .bd circle{fill:currentColor}
.fig .th-gap path,.fig .th-gap ellipse{fill:var(--gapc);stroke:var(--gapc);stroke-width:5;stroke-linejoin:round}
.fig .th{opacity:.62}
.fig .th path,.fig .th ellipse{fill:currentColor;stroke:none}
.fig path.gap{stroke:var(--gapc)}
.fig circle.gap{fill:var(--gapc)}
.fig path.ac{stroke:var(--acc)}
.fig circle.ac{fill:var(--acc)}
.fig .wfill{fill:currentColor;opacity:.06}
.fig .wh{stroke:currentColor;stroke-width:1.3;opacity:.3}
.fig .wl{stroke:currentColor;stroke-width:3;opacity:.8}
.fig .tbl{fill:currentColor;opacity:.5}
.fig .floor{stroke:currentColor;stroke-width:2;opacity:.16}
.fig .guide{stroke:var(--acc);stroke-width:2;stroke-dasharray:1 7;opacity:.6;fill:none}
.fig .ring{fill:none;stroke:var(--acc);stroke-width:2.5}
.fig .glow{fill:var(--acc)}
.fig text{fill:currentColor;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.16em;opacity:.45}

/* ---- promemoria postura (popup a molla, mosso da JS) ---- */
#remind{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 82px);z-index:4;display:flex;justify-content:center;pointer-events:none;padding:0 18px;--gapc:#1c1f25;--acc:var(--orange)}
#remind .card{width:100%;max-width:440px;height:150px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1px 1fr;align-items:stretch;padding:10px 6px 14px;border-radius:30px;color:var(--ink);
  background:rgba(20,22,27,.86);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.35);
  will-change:transform,opacity;transform-origin:50% 0}
#remind .sep{background:rgba(255,255,255,.1);margin:10px 0}
#remind .col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
#remind .col .fig{flex:1 1 auto;width:100%;min-height:0;max-height:200px}
#remind .col b{font-family:var(--display);font-weight:700;font-size:clamp(17px,5.2vw,24px);letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap}

/* ---- come si fa (pannello dalla Home) ---- */
#detail{position:fixed;inset:0;z-index:6;background:rgba(8,9,11,.45);display:flex;align-items:flex-end;animation:fade .25s ease-out}
#detail .panel{position:relative;width:100%;box-sizing:border-box;padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px;color:var(--ink);
  background:rgba(26,29,35,.72);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -10px 40px rgba(0,0,0,.4);border-radius:34px 34px 0 0;animation:up .5s cubic-bezier(.2,.9,.25,1);
  --gapc:#1d2026;--acc:var(--orange);max-height:92%;overflow-y:auto}
#detail.pd .panel{--acc:var(--blue)}
#detail.closing{animation:fadeOut .25s ease-in forwards}
#detail.closing .panel{animation:down .28s cubic-bezier(.4,0,1,1) forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
#detail .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);align-self:center;margin:-8px 0 0}
.dclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.dclose svg{width:16px;height:16px;opacity:.8}
.dfig{align-self:center;width:min(70vw,34vh,280px);aspect-ratio:1;margin:4px 0 2px}
.dfig .fig{width:100%;height:100%}
#detail .eyebrow{color:var(--acc);opacity:1}
#detail h3{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.dcue{font-size:17px;line-height:1.38;margin:0;opacity:.88;text-wrap:pretty}
.dcue small{display:block;margin-top:6px;font-size:14px;font-weight:600;opacity:.7}
.dspec{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0}
.dspec span{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.dsets{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 4px}
.dsets > span{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,52px);padding:4px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);position:relative}
.seg button{position:relative;z-index:1;height:38px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);transition:color .25s}
.seg button[aria-checked="true"]{color:var(--dark)}
.seg::before{content:"";position:absolute;top:4px;left:4px;width:52px;height:38px;border-radius:999px;background:var(--orange);transform:translateX(calc(var(--si,0) * 52px));transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
#detail .go{margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px}
#detail .go svg{width:22px;height:22px}
#detail.pd .go{background:var(--blue)}

/* ---- pause sheet ---- */
#sheet{position:fixed;inset:0;z-index:5;background:rgba(8,9,11,.35);display:flex;align-items:flex-end;animation:fade .2s ease-out}
#sheet .panel{width:100%;box-sizing:border-box;padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;background:rgba(26,29,35,.62);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -10px 40px rgba(0,0,0,.35);border-radius:32px 32px 0 0;animation:up .45s cubic-bezier(.2,.9,.25,1)}
#sheet .head{display:flex;align-items:center;gap:14px;margin-bottom:2px}
#sheet .head .ring{width:56px;height:56px;color:var(--ink);--acc:var(--orange);--pd:var(--blue)}
#sheet .head b{display:block;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin:-8px 0 6px}
#sheet h3{font-family:var(--display);font-weight:700;font-size:44px;line-height:.9;margin:0;text-transform:uppercase}
#sheet .info{color:var(--ink);font-size:16px;margin:0 0 6px;opacity:.8}
#sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#sheet .row button{min-height:54px;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);font-weight:600;font-size:16px;transition:transform .15s}
#sheet .row button:active{transform:scale(.97)}
#sheet .row button:disabled{opacity:.35}
#sheet .low{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
#sheet .quit{color:#ff8a5c;font-weight:600;font-size:16px;min-height:44px;padding:0 4px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40%)}}

@media (max-height:600px){
  .ready .fig{max-height:28vh}.ready h2{font-size:38px}.cue{font-size:16px}
  .work .fig{max-height:20vh}.reps{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){
  .h-hero::before,.home .go::after,
  .enter > *,.enter .mid > *,.enter .center > *,.tapto,.sw-in{animation:none}
}
</style>

</head>
<body>
<div id="stage" data-tone="ready" role="application" aria-label="Spalla">
  <div class="layer base"></div>
  <div class="layer fill" hidden></div>
</div>
<div id="remind" hidden aria-live="polite">
  <div class="card">
    <div class="col"><svg class="fig" viewBox="0 0 80 80" aria-hidden="true"><g id="rmA"></g></svg><b>Ascella attaccata</b></div>
    <div class="sep"></div>
    <div class="col"><svg class="fig" viewBox="0 0 80 80" aria-hidden="true"><g id="rmB"></g></svg><b>Petto in fuori</b></div>
  </div>
</div>
<div id="detail" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="grab"></div>
    <button class="dclose" data-act="closeDetail" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="dfig" id="dFig"></div>
    <div class="eyebrow" id="dEyebrow"></div>
    <h3 id="dTitle"></h3>
    <p class="dcue" id="dCue"></p>
    <div class="dspec" id="dSpec"></div>
    <button class="go" data-act="runOne" id="dRun"></button>
  </div>
</div>
<div id="sheet" hidden>
  <div class="panel">
    <div class="grab"></div>
    <div class="head"><span id="sheetRing"></span><div><b id="sheetPct"></b><h3>In pausa</h3></div></div>
    <p class="info" id="sheetInfo"></p>
    <button class="go" data-act="resume">Riprendi</button>
    <div class="row">
      <button data-act="prev" id="prevBtn">← Precedente</button>
      <button data-act="skip">Salta →</button>
    </div>
    <div class="low">
      <button class="icon glass" data-act="sound" data-sound-icon aria-label="Suono"></button>
      <button class="quit" data-act="quit" id="quitBtn">Termina</button>
    </div>
  </div>
</div>

<script>
(() => {
/* ================= Impostazioni ================= */
const CFG = { push: 5, rest: 5, reps: 10, rounds: 3, ready: 5, pend: 30 };
const POSTURE = 'Ascella attaccata · petto in fuori';

/* ================= Geometria ================= */
const D = Math.PI / 180;
const f = n => Math.round(n * 10) / 10;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const pol = (o, l, deg) => [o[0] + l * Math.sin(deg * D), o[1] + l * Math.cos(deg * D)]; // 0° = giù, + = verso destra
const add = (a, v, k = 1) => [a[0] + v[0] * k, a[1] + v[1] * k];
const pt = p => `${f(p[0])} ${f(p[1])}`;
const line = (pts, w, cls = '') => `<path${cls ? ` class="${cls}"` : ''} stroke-width="${w}" d="M${pts.map(pt).join('L')}"/>`;
const dot = (p, r, cls = '', extra = '') => `<circle${cls ? ` class="${cls}"` : ''} cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r)}"${extra}/>`;

// Arto evidenziato: contorno del colore di fondo + tratto colorato, così si stacca dal corpo.
function limb(pts, w, fist, fr) {
  let s = line(pts, w + 6, 'gap') + (fist ? dot(fist, fr + 3, 'gap') : '');
  return s + line(pts, w, 'ac') + (fist ? dot(fist, fr, 'ac') : '');
}
function arrowPath(a, b, op) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), h = 8;
  const p1 = [b[0] - h * Math.cos(ang - .6), b[1] - h * Math.sin(ang - .6)];
  const p2 = [b[0] - h * Math.cos(ang + .6), b[1] - h * Math.sin(ang + .6)];
  const d = `M${pt(a)}L${pt(b)}M${pt(p1)}L${pt(b)}L${pt(p2)}`;
  return `<g opacity="${f(op * 100) / 100}"><path class="gap" stroke-width="9" d="${d}"/><path class="ac" stroke-width="3.5" d="${d}"/></g>`;
}
function rings(p, t, eff) {
  if (eff < .03) return '';
  let s = '';
  for (let k = 0; k < 2; k++) {
    const ph = (t * 1.25 + k * .5) % 1;
    s += dot(p, 4 + 16 * ph, 'ring', ` opacity="${f(eff * (1 - ph) * 90) / 100}"`);
  }
  return s;
}
function wallV(x, y1, y2, side) {
  const w = 18, x0 = side > 0 ? x : x - w;
  let d = '';
  for (let y = y1 + 10; y <= y2; y += 9) d += `M${x} ${y}l${side * 11} -9`;
  return `<rect class="wfill" x="${x0}" y="${y1}" width="${w}" height="${y2 - y1}"/><path class="wh" d="${d}"/><path class="wl" d="M${x} ${y1}V${y2}"/>`;
}
const label = s => `<text x="2" y="10">${s}</text>`;
const floorLine = '<path class="floor" d="M14 193H186"/>';

/* ---- corpi (parte ferma del disegno) ---- */
const SIDE_BODY = `<g class="bd">
  ${line([[88, 124], [91, 158], [93, 189], [103, 190]], 15)}
  ${line([[88, 124], [84, 158], [82, 189], [92, 190]], 15)}
  <path stroke-width="23" d="M88 122Q101 96 90 72"/>
  ${dot([95, 46], 13)}
</g>`;
const FRONT_BODY = `<g class="bd">
  ${line([[90, 126], [88, 160], [87, 189], [81, 190]], 15)}
  ${line([[102, 126], [104, 160], [105, 189], [111, 190]], 15)}
  ${line([[96, 82], [96, 122]], 30)}
  ${line([[79, 74], [113, 74]], 16)}
  ${dot([96, 48], 13)}
  ${line([[78, 76], [74, 104], [73, 128]], 11)}
</g>`;
// Testa vista dall'alto: ovale un po' allungato, naso attaccato davanti e due orecchie ai lati.
// Ha un bordo del colore dello sfondo e un grigio più chiaro delle spalle, così si stacca da loro.
const TOP_HEAD = `<ellipse cx="96" cy="111" rx="12.5" ry="13.5"/><ellipse cx="96" cy="97.6" rx="3.4" ry="2.8"/>`
  + `<ellipse cx="83.2" cy="111" rx="2.1" ry="3.6"/><ellipse cx="108.8" cy="111" rx="2.1" ry="3.6"/>`;
const TOP_BODY = `<g class="bd">
  ${line([[72, 118], [120, 118]], 24)}
</g>
<g class="th-gap">${TOP_HEAD}</g>
<g class="th">${TOP_HEAD}</g>`;

/* ---- disegni degli isometrici ----
   b = arrivo in posizione (0→1), eff = forza (0→1), t = secondi */
function tremor(t, eff) { return eff > .4 && !REDUCE ? Math.sin(t * 52) * .45 * eff : 0; }

function sideIso(o) {
  const S = [90, 72];
  return {
    lab: 'DI LATO', mirror: true,
    still: floorLine + o.scene + SIDE_BODY,
    draw(t, b, eff) {
      const push = eff * 1.5 + tremor(t, eff);
      const v = [o.dir[0] * push, o.dir[1] * push];
      const E = add(pol(S, 31, o.th1), v);
      const a2 = lerp(8, 90, ease(b));
      const H = add(pol(pol(S, 31, o.th1), 30, a2), v);
      const F = add(pol(pol(S, 31, o.th1), 33, a2), v);
      return dot(S, 11 + 3 * eff, 'glow', ` opacity="${f(eff * 35) / 100}"`)
        + limb([S, E, H], 12, F, 7)
        + rings(o.hit, t, eff * b)
        + arrowPath(add(o.arrow[0], o.dir, eff * 3), add(o.arrow[1], o.dir, eff * 3), (.22 + .78 * eff) * ease(b));
    }
  };
}
function frontIso(o) {
  const S = [114, 76];
  return {
    lab: 'DI FRONTE', mirror: false,
    still: floorLine + o.scene + FRONT_BODY,
    draw(t, b, eff) {
      const push = eff * 1.5 + tremor(t, eff);
      const v = [o.dir[0] * push, 0];
      const E0 = pol(S, 30, 7), E = add(E0, v);
      const bb = ease(b);
      // avambraccio: da giù (penzola) a puntato verso chi guarda (accorciato in prospettiva)
      const Hdown = pol(E0, 26, 3), Hfwd = [E0[0] - 1.5, E0[1] + 7];
      const H = add([lerp(Hdown[0], Hfwd[0], bb), lerp(Hdown[1], Hfwd[1], bb)], v);
      return dot(S, 11 + 3 * eff, 'glow', ` opacity="${f(eff * 35) / 100}"`)
        + limb([S, E, H], 12, H, lerp(6.5, 8.5, bb))
        + rings(o.hit, t, eff * b)
        + arrowPath(add(o.arrow[0], o.dir, eff * 3), add(o.arrow[1], o.dir, eff * 3), (.22 + .78 * eff) * bb);
    }
  };
}
function topIso(o) {
  const Sh = [122, 118], E0 = [129, 124];
  return {
    lab: 'DALL’ALTO', mirror: true, vb: [22, 22, 150, 150],
    still: o.scene + TOP_BODY,
    draw(t, b, eff) {
      const push = eff * 1.5 + tremor(t, eff);
      const v = [o.dir[0] * push, 0];
      const bl = ease(clamp(b * 1.7)), br = ease(clamp((b - .45) / .55));
      const L = lerp(5, 40, bl), ph = lerp(o.phi0, 0, br) * D;
      const E = add(E0, v, .4);
      const H = add([E0[0] + L * Math.sin(ph), E0[1] - L * Math.cos(ph)], v);
      const F = add([E0[0] + (L + 4) * Math.sin(ph), E0[1] - (L + 4) * Math.cos(ph)], v);
      return dot(Sh, 11 + 3 * eff, 'glow', ` opacity="${f(eff * 35) / 100}"`)
        + limb([Sh, E, H], 12, F, lerp(6, 7.5, bl))
        + rings(o.hit, t, eff * br)
        + arrowPath(add(o.arrow[0], o.dir, eff * 3), add(o.arrow[1], o.dir, eff * 3), (.22 + .78 * eff) * br);
    }
  };
}

/* ---- disegni del pendolo ---- */
const AMP = 24;
// Tutti e tre i movimenti usano lo stesso omino: busto in avanti, mano libera sul tavolo, braccio che pende.
// Cambia solo la traiettoria della mano (tratteggiata).
function pendFig(mode) {
  const Sh = [120, 98], A = AMP * D;
  // posizione di un punto del braccio lungo L, per un certo angolo di fase
  const arm = (L, a) => {
    if (mode === 'fb') { const q = A * Math.sin(a); return [Sh[0] + L * Math.sin(q), Sh[1] + L * Math.cos(q)]; }
    if (mode === 'lat') { const q = A * Math.sin(a); return [Sh[0] + L * .2 * Math.sin(a), Sh[1] + L * Math.cos(q)]; }
    const qx = A * Math.cos(a), qz = A * Math.sin(a);   // cerchio: avanti/indietro + verso chi guarda
    return [Sh[0] + L * Math.sin(qx) + L * .2 * Math.sin(a), Sh[1] + L * Math.cos(qx) * Math.cos(qz * .8)];
  };
  // gomito sul primo tratto; l'avambraccio segue con un leggero ritardo (lag), come un vero pendolo
  const pose = ang => {
    const E = arm(32, ang), lag = ang - .45, h = arm(30, lag), fz = arm(33, lag);
    return {
      E,
      H: [E[0] + h[0] - Sh[0], E[1] + h[1] - Sh[1]],
      F: [E[0] + fz[0] - Sh[0], E[1] + fz[1] - Sh[1]],
      r: 7 * (mode === 'fb' ? 1 : 1 + .2 * Math.sin(lag)),   // la mano si ingrandisce quando viene verso di te
    };
  };
  let guide = '';
  for (let k = 0; k <= 48; k++) guide += (k ? 'L' : 'M') + pt(pose(k / 48 * Math.PI * 2).F);
  return {
    lab: 'DI LATO', mirror: true,
    still: floorLine
      + `<rect class="tbl" x="158" y="116" width="40" height="6" rx="2"/><rect class="tbl" x="188" y="122" width="5" height="70"/>`
      + `<path class="guide" d="${guide}"/>`
      + `<g class="bd">${line([[64, 128], [66, 160], [64, 189], [74, 190]], 15)}${line([[64, 128], [58, 160], [54, 189], [64, 190]], 15)}<path stroke-width="23" d="M64 126Q84 96 122 96"/>${dot([139, 85], 13)}${line([[124, 97], [142, 108], [162, 114]], 11)}</g>`,
    draw(t, b, eff, ang) {
      const P = pose(ang);
      return limb([Sh, P.E, P.H], 12, P.F, P.r);
    }
  };
}

/* ================= Esercizi ================= */
const EX = [
  { name: 'Pugno contro la parete', short: 'Pugno', cue: 'Muro davanti a te, gomito a 90°. Spingi il pugno in avanti.',
    fig: () => sideIso({ th1: 0, dir: [1, 0], hit: [131, 103], arrow: [[137, 103], [160, 103]], scene: wallV(131, 24, 192, 1) }) },
  { name: 'Gomito contro la parete', short: 'Gomito', cue: 'Schiena vicino al muro. Spingi il gomito indietro.',
    fig: () => sideIso({ th1: -24, dir: [-1, 0], hit: [71, 100], arrow: [[64, 100], [41, 100]], scene: wallV(71, 24, 192, -1) }) },
  { name: 'Spalla contro la parete', short: 'Spalla', cue: 'Fianco al muro, gomito a 90°. Ruota verso l’esterno e spingi contro il muro.',
    fig: () => topIso({ phi0: -26, dir: [1, 0], hit: [137, 100], arrow: [[143, 100], [166, 100]], scene: wallV(137, 30, 150, 1) }) },
  { name: 'Avambraccio contro la parete', short: 'Avambraccio', cue: 'Come per la spalla, ma il muro arriva solo a metà avambraccio: mano libera oltre lo spigolo. Ruota verso l’esterno.',
    // come la spalla (vista dall'alto), ma il muro finisce a metà avambraccio: lo spigolo è a y=104
    fig: () => topIso({ phi0: -26, dir: [1, 0], hit: [137, 113], arrow: [[143, 113], [166, 113]], scene: wallV(137, 104, 150, 1) }) },
  { name: 'Palmo contro la parete', short: 'Palmo', cue: 'Palmo contro lo stipite, come per chiudere una porta. Spingi verso la pancia.',
    fig: () => topIso({ phi0: 26, dir: [-1, 0], hit: [121, 80], arrow: [[115, 80], [92, 80]], scene: wallV(121, 34, 96, -1) }) },
  { name: 'Pugno sul tavolo', short: 'Tavolo', cue: 'Gomito a 90°, pugno sul tavolo. Spingi verso il basso.',
    fig: () => sideIso({ th1: 0, dir: [0, 1], hit: [123, 111], arrow: [[123, 64], [123, 89]],
      scene: '<rect class="tbl" x="106" y="111" width="92" height="7" rx="2"/><rect class="tbl" x="114" y="118" width="5" height="74"/><rect class="tbl" x="188" y="118" width="5" height="74"/>' }) },
];
const PEND = [
  { mode: 'fb', name: 'Avanti e indietro', cue: 'Altra mano sul tavolo, busto in avanti. Braccio morbido: lascialo oscillare avanti e indietro.', fig: () => pendFig('fb') },
  { mode: 'lat', name: 'Laterale', cue: 'Ora da un lato all’altro. Movimento piccolo, spalla rilassata.', fig: () => pendFig('lat') },
  { mode: 'circ', name: 'Cerchietti', cue: 'Piccoli cerchi. A metà tempo cambia senso.', fig: () => pendFig('circ') },
];
// st.seg = in quale arco dell'anello cade lo step
function fullPlan() {
  const out = [];
  for (let r = 1; r <= CFG.rounds; r++) EX.forEach((ex, k) => out.push({ kind: 'iso', ex, round: r, k, seg: r - 1 }));
  PEND.forEach((p, k) => out.push({ kind: 'pend', p, k, seg: CFG.rounds }));
  return out;
}
function singlePlan(idx, sets) {
  if (idx >= EX.length) return PEND.map((p, k) => ({ kind: 'pend', p, k, seg: 0 }));
  const out = [];
  for (let r = 1; r <= sets; r++) out.push({ kind: 'iso', ex: EX[idx], round: r, k: idx, seg: r - 1 });
  return out;
}
let STEPS = fullPlan();

/* ================= Stato ================= */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const base = stage.querySelector('.base'), fill = stage.querySelector('.fill');
const sheet = document.getElementById('sheet'), quitBtn = document.getElementById('quitBtn');
const remindEl = document.getElementById('remind');
const S = { screen: 'home', i: 0, worked: 0, fromI: 0, phase: '', rep: 1, t0: 0, dur: 0, paused: false, left: 0, startedAt: 0,
  lastNum: null, ang: 0, dir: 1, eff: 0, enteredAt: 0, slosh: 0, doneAt: 0, fig: null, sound: true };

/* ---------- memoria locale (solo su questo telefono) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
S.sound = store.get('spalla.sound', true);
const readLog = () => store.get('spalla.log', []);
function dayDiff(iso) { const a = new Date(iso), b = new Date(); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 864e5); }
function lastText() {
  const l = readLog(); if (!l.length) return 'prima sessione';
  const d = dayDiff(l[l.length - 1]);
  return 'ultima ' + (d === 0 ? 'oggi' : d === 1 ? 'ieri' : d + ' giorni fa');
}
function weekStrip() {
  const days = new Set(readLog().map(dayDiff));
  const L = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];
  let s = '';
  for (let d = 6; d >= 0; d--) {
    const dt = new Date(); dt.setDate(dt.getDate() - d);
    s += `<div class="d${days.has(d) ? ' on' : ''}${d === 0 ? ' today' : ''}"><i></i><span>${L[dt.getDay()]}</span></div>`;
  }
  return `<div class="week" aria-label="Ultimi 7 giorni">${s}</div>`;
}

  const act = b && b.dataset.act, now = performance.now();
  if (act === 'start' || act === 'resumeSession' || act === 'runOne') enableTilt();
  if (act === 'start') { usePlan(fullPlan()); S.worked = 0; S.fromI = 0; workClock = 0; nextRemind = rand(8, 18); S.startedAt = now; keepAwake(); return goStep(0, now); }
  if (act === 'resumeSession') { usePlan(fullPlan()); const pi = store.get('spalla.progress', { i: 0 }).i; S.worked = 1; S.fromI = pi; S.startedAt = now; keepAwake(); return goStep(pi, now); }
  if (act === 'home') return goHome();
  if (act === 'detail') return openDetail(+b.dataset.i);
  if (act === 'closeDetail') return closeDetail();
  if (act === 'runOne') return runOne();
  if (e.target === detailEl) return closeDetail();
  if (act === 'menu') return pause();
  if (act === 'resume') return resume();
  if (act === 'skip') return nextStep(now);
  if (act === 'prev') return goStep(Math.max(0, S.i - 1), now);
  if (act === 'sound') { S.sound = !S.sound; store.set('spalla.sound', S.sound); paintSound(); if (S.sound) SND.tick(); return; }
  if (act === 'quit') {
    if (quitBtn.dataset.armed) return goHome();
    quitBtn.dataset.armed = '1'; quitBtn.textContent = 'Tocca ancora per uscire'; return;
  }
  if (e.target.closest('#sheet')) { if (e.target === sheet) resume(); return; }
  if (S.screen === 'ready' || S.screen === 'work') pause();
});
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { if (!e.target.closest('button')) { e.preventDefault(); stage.click(); } }
  if (e.key === 'Escape') { if (!detailEl.hidden) return closeDetail(); S.paused ? resume() : pause(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pause();
  else { keepAwake(); playAwake(); try { ac && ac.state === 'suspended' && ac.resume(); } catch {} }
});

/* ================= Animazione ================= */
let lastT = performance.now();
/* Inclinazione: leggo il sensore del telefono (gamma = inclinazione destra/sinistra) e tengo
   la superficie del liquido in piano rispetto al pavimento, come l'acqua in un bicchiere.
   Una piccola molla fa "oscillare" il liquido quando muovi il telefono. Su iPhone serve il permesso,
   che chiedo al primo tocco su Inizia; se non c'è il sensore o il permesso, l'onda resta dritta. */
const TILT = { target: 0, ang: 0, v: 0, on: false, asked: false };
function onOrient(e) {
  if (e.gamma == null) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (so !== 0) { TILT.target = 0; return; }                      // l'app è pensata in verticale
  TILT.target = clamp(-e.gamma, -40, 40) * D;
}
function enableTilt() {
  if (TILT.asked) return; TILT.asked = true;
  const on = () => { if (!TILT.on) { TILT.on = true; addEventListener('deviceorientation', onOrient); } };
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') on(); }).catch(() => {});
    } else if ('DeviceOrientationEvent' in window) on();
  } catch {}
}
function tiltStep(dt) {
  if (!TILT.on || REDUCE) { TILT.ang = 0; return; }
  // molla un po' morbida: il liquido insegue l'inclinazione e si assesta con un piccolo dondolio
  const k = 60, c = 9;
  for (let i = 0; i < 3; i++) { const acc = -k * (TILT.ang - TILT.target) - c * TILT.v; TILT.v += acc * dt / 3; TILT.ang += TILT.v * dt / 3; }
  S.slosh = Math.max(S.slosh, Math.min(.6, Math.abs(TILT.v) * .25));  // muovendolo, l'onda si agita un po'
}

function setFill(p, now) {
  const H = stage.clientHeight, W = stage.clientWidth;
  if (p <= .0005) { fill.style.clipPath = 'inset(100% 0 0 0)'; return; }
  const idle = S.paused && S.screen !== 'done';
  const slope = Math.tan(TILT.ang);
  if (p >= .9995 && S.slosh < .02 && !idle && Math.abs(slope) < .01) { fill.style.clipPath = 'inset(0 0 0 0)'; return; }
  const y = H * (1 - p);
  let A = REDUCE ? 0 : 8 * Math.sin(Math.PI * Math.min(1, p * 1.4)) + 16 * S.slosh;
  if (idle && !REDUCE) A = Math.max(A, 7);   // in pausa: onda lenta, come acqua ferma che respira
  const N = 24;
  let pts = `0px ${H}px,${W}px ${H}px`;
  for (let k = N; k >= 0; k--) {
    const u = k / N;
    const w = Math.sin(u * Math.PI * 2.2 + now / 520) * .75 + Math.sin(u * Math.PI * 4.1 - now / 830) * .25;
    pts += `,${f(u * W)}px ${f(y + A * w + (u * W - W / 2) * slope)}px`;
  }
  fill.style.clipPath = `polygon(${pts})`;
}
/* ---- pannello "come si fa" ---- */
const detailEl = document.getElementById('detail');
const D_ = { i: -1, sets: 1, fig: null, at: 0 }; // un esercizio singolo = 1 serie
function openDetail(i) {
  D_.i = i; D_.at = performance.now();
  const pend = i >= EX.length, ex = EX[i];
  D_.fig = pend ? PEND[0].fig() : ex.fig();
  detailEl.classList.toggle('pd', pend);
  document.getElementById('dFig').innerHTML = figSvg(D_.fig);
  document.getElementById('dEyebrow').textContent = pend ? 'Alla fine dei 3 giri' : `Esercizio ${i + 1} di ${EX.length}`;
  document.getElementById('dTitle').textContent = pend ? 'Pendolo' : ex.name;
  document.getElementById('dCue').innerHTML = pend
    ? `Altra mano sul tavolo, busto in avanti, braccio morbido. Tre movimenti: avanti e indietro, laterale, cerchietti.`
    : `${ex.cue}<small>${POSTURE}</small>`;
  document.getElementById('dSpec').innerHTML = pend
    ? `<span>3 movimenti</span><span>${CFG.pend}″ ciascuno</span>`
    : `<span>${CFG.push}″ spingi</span><span>${CFG.rest}″ riposo</span><span>× ${CFG.reps}</span>`;
  document.getElementById('dRun').innerHTML = `${pend ? 'Fai il pendolo' : 'Fai questo esercizio'}${ARROW}`;
  detailEl.classList.remove('closing');
  detailEl.hidden = false;
}
function closeDetail(now) {
  if (detailEl.hidden) return;
  if (now === true) { detailEl.hidden = true; D_.fig = null; return; }
  detailEl.classList.add('closing');
  setTimeout(() => { detailEl.hidden = true; detailEl.classList.remove('closing'); D_.fig = null; }, 280);
}
function runOne() {
  const i = D_.i, pend = i >= EX.length;
  usePlan(singlePlan(i, D_.sets), pend ? 'Pendolo' : EX[i].short + (D_.sets > 1 ? ` · ${D_.sets} serie` : ''));
  closeDetail(true);
  workClock = 0; nextRemind = rand(8, 18);
  S.startedAt = performance.now(); keepAwake();
  goStep(0, performance.now());
}

function homeFrame(now, t) {
  if (D_.fig) {
    // stessa dimostrazione della schermata "Prossimo": arriva in posizione e poi spinge a ritmo
    const tr = (now - D_.at) / 1000, b = REDUCE ? 1 : clamp((tr - .3) / 1.1);
    const eff = D_.i < EX.length && tr > 1.6 && ((tr - 1.6) % 2.8) < 1.5 ? 1 : 0;
    D_.eff = (D_.eff || 0) + (eff - (D_.eff || 0)) * .15;
    const dyn = detailEl.querySelector('.dyn');
    if (dyn) dyn.innerHTML = D_.fig.draw(t, b, D_.eff, REDUCE ? 0 : t * Math.PI * 2 / 2.4);
  }
  const done = S.homeFr.reduce((a, x, k) => a + x * SEGW[k], 0);
  paintRing(fracsByAmount(ease(clamp((now - S.homeAt - 250) / 1400)) * done), stage);
  const dyns = stage.querySelectorAll('.base .pc .dyn');
  S.homeFigs.forEach((fg, k) => {
    if (!dyns[k]) return;
    const eff = REDUCE ? 0 : .5 - .5 * Math.cos(t * 2.2 + k * 1.1);
    dyns[k].innerHTML = fg.draw(t, 1, eff * eff, REDUCE ? 0 : t * Math.PI * 2 / 2.4);
  });
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  remindFrame(dt, t);
  morphFrame(now);
  tiltStep(dt);

  if (S.screen === 'done') {
    const p = ease(clamp((now - S.doneAt) / 1400));
    setFill(p, now);
    paintRing(fracsByAmount(ease(clamp((now - S.doneAt - 150) / 1500)) * TOTW), stage);
    return;
  }
  if (S.screen === 'home') { homeFrame(now, t); return; }
  if (S.screen !== 'ready' && S.screen !== 'work') return;

  if (!S.paused) {
    let guard = 0;
    while ((S.screen === 'ready' || S.screen === 'work') && !S.paused && now - S.t0 >= S.dur * 1000 && guard++ < 6) advance();
    if (S.screen !== 'ready' && S.screen !== 'work') return;
  }
  const e = S.paused ? S.dur * 1000 - S.left : now - S.t0;
  const p = clamp(e / (S.dur * 1000));
  S.slosh *= Math.exp(-dt * 2.6);
  setFill(S.phase === 'rest' ? 1 - p : p, now);

  const remain = Math.max(1, Math.ceil(S.dur - e / 1000));
  if (remain !== S.lastNum) {
    if (S.lastNum !== null && !S.paused && S.screen === 'ready' && remain <= 3) SND.tick();
    S.lastNum = remain; setNum(remain);
  }

  paintRing(fracsAt(S.i, partialNow(now)), stage);

  // figura
  const st = STEPS[S.i];
  if (S.screen === 'work' && st.kind === 'iso' && !S.paused) {
    workClock += dt;
    if (workClock >= nextRemind) { nextRemind = workClock + rand(18, 40); showRemind(); }
  }
  let b = 1, target = 0;
  if (S.screen === 'ready') {
    const tr = (now - S.enteredAt) / 1000;
    b = REDUCE ? 1 : clamp((tr - .35) / 1.1);
    if (st.kind === 'iso' && tr > 1.8) target = ((tr - 1.8) % 2.8) < 1.5 ? 1 : 0;
  } else if (st.kind === 'iso') target = S.phase === 'push' && !S.paused ? 1 : 0;
  S.eff += (target - S.eff) * (1 - Math.exp(-dt * 9));
  if (st.kind === 'pend') {
    if (S.screen === 'work' && st.p.mode === 'circ' && p >= .5 && S.dir === 1) {
      S.dir = -1; swapText('[data-phase]', 'Cambia senso'); SND.flip();
    }
    if (!S.paused && !REDUCE) S.ang += dt * (Math.PI * 2 / 2.4) * S.dir;
  }
  if (S.fig) setHTML('.dyn', S.fig.draw(t, b, S.eff, S.ang));
}

goHome();
keepAwake();
requestAnimationFrame(frame);
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
